name: Deploy Frontend

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: abeypad-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH != '' && vars.VPS_DEPLOY_PATH || '/opt/apps/abeypad' }}
      VPS_PORT: ${{ vars.VPS_SSH_PORT != '' && vars.VPS_SSH_PORT || '22' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Ensure remote directories exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '${DEPLOY_PATH}/dist' '${DEPLOY_PATH}/deploy'"

      - name: Upload static bundle
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            -e "ssh -p ${VPS_PORT}" \
            dist/ "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/dist/"

      - name: Upload runtime configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az \
            -e "ssh -p ${VPS_PORT}" \
            deploy/docker-compose.yml deploy/nginx.conf \
            "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/deploy/"

      - name: Start or reload frontend container
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" \
            "cd '${DEPLOY_PATH}/deploy' && docker compose up -d"

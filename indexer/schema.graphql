# Central entity for every .abey domain.
# id = node (bytes32 namehash of the full domain, e.g. namehash("foo.abey"))
type Domain @entity {
  id: Bytes!
  name: String             # label without TLD, e.g. "foo"
  fullName: String         # full domain name, e.g. "foo.abey"
  labelHash: Bytes         # keccak256(label)

  owner: Account           # current owner per Registry
  registrant: Bytes        # address that originally registered the name
  resolver: Bytes          # address of the active resolver contract

  resolvedAddress: Bytes   # address this domain resolves to (from Resolver.addr)
  reverseName: String      # reverse record name (from Resolver.name)
  contenthash: Bytes       # IPFS / IPNS / Swarm content hash

  expiry: BigInt           # Unix timestamp when registration expires
  gracePeriodEnd: BigInt   # Unix timestamp of grace period end (expiry + 7,776,000 s)
  ttl: BigInt              # TTL in seconds from Registry

  createdAt: BigInt        # block timestamp of first registration
  createdAtBlock: BigInt   # block number of first registration

  textRecords: [TextRecord!]! @derivedFrom(field: "domain")
  registrations: [Registration!]! @derivedFrom(field: "domain")
  renewals: [Renewal!]! @derivedFrom(field: "domain")
  releases: [Release!]! @derivedFrom(field: "domain")
}

# Wallet address that owns one or more domains.
type Account @entity {
  id: Bytes!                          # wallet address (lowercase)
  domains: [Domain!]! @derivedFrom(field: "owner")
}

# One NameRegistered event.
type Registration @entity {
  id: Bytes!                          # txHash + logIndex
  domain: Domain!
  registrant: Bytes!
  expiryDate: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionID: Bytes!
}

# One NameRenewed event.
type Renewal @entity {
  id: Bytes!
  domain: Domain!
  newExpiry: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionID: Bytes!
}

# One NameReleased event.
type Release @entity {
  id: Bytes!
  domain: Domain!
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionID: Bytes!
}

# Key/value text records stored on the Resolver (avatar, url, email, etc.).
# id = node.hex + "-" + key
type TextRecord @entity {
  id: String!
  domain: Domain!
  key: String!
  value: String!
}
